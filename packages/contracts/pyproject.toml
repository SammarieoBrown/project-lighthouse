[project]
name = "lighthouse-contracts"
version = "0.1.0"
description = "Project Lighthouse Phase 0 contract freeze: enums, agent I/O models, event catalogue"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lighthouse_contracts"]

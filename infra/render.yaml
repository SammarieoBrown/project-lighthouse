# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

# Project Lighthouse API deployment. This file intentionally contains no
# credentials. Render prompts for sync:false values when the Blueprint is
# created; use the production Neon branch, never the repo-root development
# DATABASE_URL.
previews:
  generation: "off"

services:
  - type: web
    name: project-lighthouse-api
    runtime: python
    region: ohio
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1
    buildCommand: python -m pip install uv==0.8.2 && uv sync --project apps/api --frozen --no-dev
    # Migrations first, then the demo donation pools. The portal's give form
    # (DON-01) renders only when a pool exists, and pools used to be created
    # only by the by-hand claim replay — which production never ran, leaving
    # the public donation surface in its empty state. Seeding is idempotent by
    # name and repairs drifted parish scope, so every deploy may run it; the
    # synthetic-claim replay stays a deliberate act.
    preDeployCommand: cd apps/api && .venv/bin/alembic upgrade head && .venv/bin/python -m app.replay.seed_pools
    startCommand: cd apps/api && .venv/bin/uvicorn app.web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: project-lighthouse-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTAKE_HAZARD_EXTERNAL_REF
        value: al132025
      # Explicit demo-only executor. It never contacts a payment provider and
      # every resulting receipt states that no real funds moved.
      - key: DISBURSEMENT_EXECUTOR_MODE
        value: simulated
      # Signs the operator session cookie. Generated once by Render and held
      # there, never in the repository. Rotating it signs every operator out,
      # which is the intended emergency control. Unset means sign-in returns
      # 503 rather than accepting forged sessions.
      - key: SESSION_SECRET
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false

  - type: worker
    name: project-lighthouse-worker
    runtime: python
    region: ohio
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    numInstances: 1
    maxShutdownDelaySeconds: 300
    buildCommand: python -m pip install uv==0.8.2 && uv sync --project apps/api --frozen --no-dev
    startCommand: cd apps/api && .venv/bin/python -m app.worker
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DATABASE_URL
        fromService:
          type: web
          name: project-lighthouse-api
          envVarKey: DATABASE_URL
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: project-lighthouse-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: INTAKE_HAZARD_EXTERNAL_REF
        value: al132025
      - key: TWILIO_ACCOUNT_SID
        fromService:
          type: web
          name: project-lighthouse-api
          envVarKey: TWILIO_ACCOUNT_SID
      - key: TWILIO_API_KEY_SID
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: lighthouse-media
      - key: INTAKE_TRANSCRIPTION_PROVIDER
        value: cloudflare_workers_ai
      - key: INTAKE_TRANSCRIPTION_MODEL
        value: "@cf/openai/whisper-large-v3-turbo"
      - key: CLOUDFLARE_AI_API_TOKEN
        sync: false

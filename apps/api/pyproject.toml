[project]
name = "lighthouse-api"
version = "0.1.0"
description = "Project Lighthouse API — web and worker entrypoints"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  # Twilio posts application/x-www-form-urlencoded, not JSON. Without this,
  # every inbound WhatsApp message 500s on form parsing.
  "python-multipart>=0.0.9",
  # Worker-only secure media acquisition and provider calls.
  "httpx>=0.27",
  # Cloudflare R2 exposes an S3-compatible endpoint; boto3 supplies audited
  # SigV4 signing instead of maintaining a home-grown signer.
  "boto3>=1.35",
  # Decode bounded images before computing the PHOTO perceptual integrity hash.
  "pillow>=10.4",
  # Worker-only vision call for the Damage Assessment Agent.
  "anthropic>=0.69",
  "geoalchemy2>=0.15",
  "lighthouse-contracts",
  "pyshp>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[tool.uv.sources]
lighthouse-contracts = { path = "../../packages/contracts", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "duckdb>=1.5.5",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
